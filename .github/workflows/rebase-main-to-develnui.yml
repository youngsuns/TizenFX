name: Rebase main to DevelNUI

on:
  workflow_dispatch:

jobs:
  rebase:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Git config
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Delete remote rebase branch if exists
      run: |
        git push origin --delete rebase-main || echo "No existing branch"

    - name: Rebase main onto DevelNUI
      run: |
        git fetch origin
        git checkout -b rebase-main origin/main
        git rebase origin/DevelNUI
        git push origin rebase-main

    - name: Create PR
      env:
        GH_TOKEN: ${{ secrets.MY_PAT }}
      run: |
        gh pr create
          --title "Rebase main to DevelNUI"
          --body "This PR rebases `main` onto `DevelNUI`. Please use **Rebase and merge** when merging."
          --base DevelNUI
          --head ${{ github.repository_owner }}:rebase-main
          --repo Samsung/TizenFX
